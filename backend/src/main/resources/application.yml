# Every setting can be overridden via environment variables (Spring relaxed binding), e.g.
#   RAGGEDLIB_LIBRARY_PATH=/library  SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/raggedlib
#   SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434  SPRING_AI_OLLAMA_CHAT_MODEL=qwen3.5:9b
#   RAGGEDLIB_INGEST_EXTRACT_CONCURRENCY=3  RAGGEDLIB_TOOLS_EBOOK_CONVERT=/opt/calibre/ebook-convert
server:
  port: 8080
  compression:
    enabled: false   # never buffer/compress the chat SSE stream
  # The web UI's server proxies /api (sign-in included) and says where the browser is through X-Forwarded-*: the
  # OIDC redirect URI must be on its origin. Tomcat trusts these headers from private addresses only.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        same-site: lax
        http-only: true

spring:
  application:
    name: raggedlib
  profiles:
    group:
      dex: oidc                    # the bundled development dex is an OIDC provider (application-dex.yml)
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 30m
  datasource:
    url: jdbc:postgresql://localhost:55432/raggedlib
    username: raggedlib
    password: raggedlib
    hikari:
      maximum-pool-size: 16
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        model: "qwen3.5:9b"
        num-ctx: 16384
      embedding:
        model: "qwen3-embedding:0.6b"
    vectorstore:
      pgvector:
        initialize-schema: false     # Flyway owns the schema (V1__init.sql)
        table-name: vector_store
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        name: raggedlib
        version: 1.0.0
        protocol: STATELESS          # streamable HTTP without sessions: plain POST /mcp per call
        type: SYNC
        capabilities:                # tools only
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >-
          Tools over the user's ebook libraries (mostly technical books, indexed from Calibre).
          search_library finds relevant passages fast (no LLM); ask_library writes a cited answer with a local LLM
          (slow, 20-90 s). Cite passages by book title and page/section. list_books / list_tags give ids and tags to
          narrow a search; library_status tells how much of the library is indexed. With a personal API key that
          has the scopes, the user's favorite lists and book reviews are available too (list_favorite_lists,
          get_book_reviews, ...).
    retry:
      max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

raggedlib:
  # One Calibre library (legacy, kept for a single-library setup and to backfill books indexed before multi-library
  # support). Ignored once `libraries` below has entries.
  library-path: ${user.home}/Documents/CalibreLibrary
  # Multiple Calibre libraries, searched as their union by default. Env: RAGGEDLIB_LIBRARIES_0_NAME=NonFiction
  # RAGGEDLIB_LIBRARIES_0_PATH=/path/one RAGGEDLIB_LIBRARIES_1_NAME=Misc RAGGEDLIB_LIBRARIES_1_PATH=/path/two
  libraries: []
  tmp-dir: ${java.io.tmpdir}
  metadata-source: auto          # auto (calibredb, fallback metadata.db) | calibredb | sqlite
  cors-origins: http://localhost:3000
  tools:
    calibredb: calibredb
    ebook-convert: ebook-convert
    pdftotext: pdftotext
    pdftoppm: pdftoppm
    pdfinfo: pdfinfo
    pdfimages: pdfimages
    tesseract: tesseract
    calibredb-timeout: 2m
    convert-timeout: 10m
  ingest:
    extract-concurrency: 3
    queue-capacity: 3
    embed-batch-size: 32
    embed-parallelism: 2
    min-letters-per-page: 80
  # OCR (Tesseract) of PDF pages without a text layer; see PdfOcr.kt. Off by itself when tesseract isn't installed.
  # Env: RAGGEDLIB_OCR_LANGUAGES=eng+nor (docker-compose: OCR_LANGUAGES, which also installs them in the image)
  ocr:
    enabled: true
    languages: eng                 # always used, besides a book's Calibre languages; must be installed
    # concurrency: 8               # pages at a time across all books; default: half the cores, at most 8
    dpi: 300
    page-timeout: 3m
    min-confidence: 50             # pages read with lower mean word confidence (photos, diagrams) are dropped
    min-image-coverage: 0.5        # in PDFs with a text layer: textless pages this much covered by images are OCR'd
  chunking:
    target-chars: 1500
    max-chars: 2000
    overlap-chars: 200
    min-chars: 80
  search:
    default-top-k: 8
    max-top-k: 50
    vector-candidates: 40
    text-candidates: 40
    rrf-k: 60
    max-chunks-per-book: 3
    hnsw-ef-search: 100
    # vector hits weigh 0..1 in RRF by cosine similarity between these bounds (embedding-model specific)
    vector-sim-floor: 0.40
    vector-sim-full: 0.70
    min-relative-score: 0.10
    max-keyword-query-chars: 500
    # keyword fallback when the strict all-terms query finds < text-candidates/2 (see KeywordFallback.kt)
    fallback-min-coverage: 0.5
    fallback-common-term-frequency: 0.05
    fallback-max-terms: 12
    term-stats-ttl-seconds: 600
  # Sign-in and roles.
  auth:
    # oidc: users sign in through an OpenID Connect provider, configured by profile `oidc` (application-oidc.yml) or
    # `dex`, which set this to oidc. single-user: no sign-in; every request without an API key is the built-in local
    # admin, and an OIDC client configured anyway is ignored. Env RAGGEDLIB_AUTH_MODE (docker-compose: AUTH_MODE).
    mode: single-user
    groups-claim: groups           # claim with the user's groups (string or list), for group-roles
    admin-claim: ""                # claim that makes a global admin; blank = groups-claim
    admin-values: []               # e.g. [administrators]; env RAGGEDLIB_AUTH_ADMIN_VALUES=administrators
    default-library-role: none     # none | viewer | curator: what every signed-in user has in every library
    # IdP groups to library roles; library = name, id or "*". Env: RAGGEDLIB_AUTH_GROUP_ROLES_0_GROUP=readers
    # RAGGEDLIB_AUTH_GROUP_ROLES_0_ROLE=viewer RAGGEDLIB_AUTH_GROUP_ROLES_0_LIBRARY=*
    group-roles: []
  # MCP endpoint (/mcp) for agent harnesses: each client sends an API key as "Authorization: Bearer <key>" or
  # "X-API-Key: <key>". Users mint personal keys in the web UI, admins system-wide ones; these configured keys are
  # system-wide keys with the library:read scope.
  # Env: RAGGEDLIB_MCP_API_KEYS_0_NAME=claude-code RAGGEDLIB_MCP_API_KEYS_0_KEY=<secret or sha256:<hex>>
  mcp:
    api-keys: []
    answer-timeout: 150s           # ask_library is cut off here (partial answer returned); clients: allow ~180 s
  # cross-encoder reranking of the fused top candidates (llama.cpp /v1/rerank, bge-reranker-v2-m3); see Reranker.kt
  rerank:
    enabled: true
    base-url: http://localhost:8091
    candidates: 30
    min-score: 0.10              # absolute relevance cutoff; lets a query with no real match come back empty
    sigmoid: true                # llama.cpp returns bge-reranker's raw logit
    max-query-chars: 1000
    max-document-chars: 2000
    connect-timeout: 1s
    timeout: 5s
    max-concurrent: 4            # match the reranker's -np slots
    queue-wait: 2s               # no slot within this: fused order for that search
    cooldown: 15s                # after a failure, skip the reranker this long
  chat:
    num-ctx: 16384
    temperature: 0.3
    history-messages: 6
    disable-thinking: true
    rewrite-num-predict: 96
    max-context-chars: 16000       # excerpt budget per answer; Ollama gives each of its 2 slots num-ctx/2 tokens
  embedding:
    dimensions: 1024

logging:
  level:
    org.springframework.ai: INFO
    # tools-only MCP server: these warn at startup that there are no resources/prompts/completions
    org.springframework.ai.mcp.annotation.provider.resource: ERROR
    org.springframework.ai.mcp.annotation.provider.prompt: ERROR
    org.springframework.ai.mcp.annotation.provider.complete: ERROR
