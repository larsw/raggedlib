name: raggedlib

# Full stack:  docker compose up -d --build      → http://localhost:3000 (sign in as gadmin / gadmin)
# Infra only (run backend/frontend on the host):  docker compose up -d postgres ollama models reranker dex

x-models: &models
  EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
  CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: raggedlib
      POSTGRES_USER: raggedlib
      POSTGRES_PASSWORD: raggedlib
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raggedlib -d raggedlib"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30
    # GPU via CDI (Container Device Interface) rather than the legacy nvidia runtime hook: with the hook,
    # a running container can silently lose the GPU after host events such as `systemctl daemon-reload`
    # ("Failed to initialize NVML: Unknown Error"), and Ollama then falls back to the CPU.
    # One-time host setup if missing: sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # Docker < 28.2 also needs CDI enabled: sudo nvidia-ctk runtime configure --runtime=docker --cdi.enabled
    # Requested as a `driver: cdi` reservation rather than `devices: [nvidia.com/gpu=all]`: older Compose
    # releases pass a CDI name under `devices:` to the daemon as a host path ("no such file or directory").
    deploy: &gpu
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]

  # Cross-encoder reranker: bge-reranker-v2-m3 (Q8_0, ~0.7 GB VRAM) behind llama.cpp's /v1/rerank. The GGUF is
  # downloaded on first start into the reranker volume. Search falls back to the fused order while it is down,
  # so it doesn't gate the backend.
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12030
    restart: unless-stopped
    command: ["-hf", "gpustack/bge-reranker-v2-m3-GGUF:Q8_0", "--reranking", "-ngl", "99",
              "-c", "16384", "-np", "4", "-b", "4096", "-ub", "4096", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - reranker:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      retries: 60
    deploy: *gpu

  # Sign-in for development: dex, an OpenID Connect provider with static users (infra/dex/config.yaml; e.g.
  # gadmin / gadmin, a global admin, and gcurator / gcurator, a curator of every library). Its issuer is
  # http://dex.localhost:5556/dex: browsers resolve *.localhost to the loopback address, where the port is published,
  # and inside this network `dex.localhost` is this container's alias,
  # so the browser and the backend reach dex at the same URL. For your own identity provider, drop this service and
  # set SPRING_PROFILES_ACTIVE=oidc plus OIDC_ISSUER_URI / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET (see README).
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    networks:
      default:
        aliases: [dex.localhost]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      retries: 20

  # One-shot: pull the embedding + chat models only if missing, so a registry hiccup can't block startup.
  models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      <<: *models
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - for m in "$$EMBED_MODEL" "$$CHAT_MODEL"; do ollama show "$$m" >/dev/null 2>&1 || ollama pull "$$m" || exit 1; done
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        # OCR languages installed in the image (and used for every scanned PDF), e.g. eng+nor+deu
        OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      models:
        condition: service_completed_successfully
      reranker:
        condition: service_started
      # the OIDC provider is discovered at startup. Not required: with AUTH_MODE=single-user, or your own provider,
      # dex isn't used (`docker compose stop dex`, or leave it out with `docker compose up -d --scale dex=0`)
      dex:
        condition: service_healthy
        required: false
    environment:
      # Sign-in: oidc (users sign in) or single-user (no sign-in: every request without an API key is the local admin)
      RAGGEDLIB_AUTH_MODE: ${AUTH_MODE:-oidc}
      # The provider, with AUTH_MODE=oidc: `dex` = the bundled dex above, with roles for its users' groups
      # (application-dex.yml); `oidc` = your own provider (OIDC_* below)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dex}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://dex.localhost:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-raggedlib}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-raggedlib-dev-secret}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email,groups}
      # Global admins: users whose groups claim (RAGGEDLIB_AUTH_GROUPS_CLAIM) holds one of these; more roles: README
      RAGGEDLIB_AUTH_ADMIN_VALUES: ${AUTH_ADMIN_GROUPS:-administrators}
      RAGGEDLIB_AUTH_DEFAULT_LIBRARY_ROLE: ${AUTH_DEFAULT_LIBRARY_ROLE:-none}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/raggedlib
      SPRING_DATASOURCE_USERNAME: raggedlib
      SPRING_DATASOURCE_PASSWORD: raggedlib
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b}
      SPRING_AI_OLLAMA_EMBEDDING_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      # Library 0 (default); add more by uncommenting a matching volume below and adding
      # RAGGEDLIB_LIBRARIES_1_NAME / RAGGEDLIB_LIBRARIES_1_PATH (see README), same pattern as MCP_API_KEY_1 etc.
      RAGGEDLIB_LIBRARIES_0_NAME: ${CALIBRE_LIBRARY_NAME:-default}
      RAGGEDLIB_LIBRARIES_0_PATH: /library/0
      RAGGEDLIB_LIBRARIES_1_NAME: ${CALIBRE_LIBRARY_1_NAME:-}
      RAGGEDLIB_LIBRARIES_1_PATH: /library/1
      # Library 2: uncomment here and the matching volume below, and set CALIBRE_LIBRARY_2 (+ _NAME) in .env, to add a third.
      RAGGEDLIB_LIBRARIES_2_NAME: ${CALIBRE_LIBRARY_2_NAME:-}
      RAGGEDLIB_LIBRARIES_2_PATH: /library/2
      RAGGEDLIB_RERANK_BASE_URL: http://reranker:8080
      # MCP endpoint http://localhost:3000/mcp (or :8090/mcp): clients send "Authorization: Bearer <key>", a key users
      # mint in the web UI (Account → API keys). MCP_API_KEY adds one system-wide key (library:read) from here.
      RAGGEDLIB_MCP_API_KEYS_0_NAME: ${MCP_API_KEY_NAME:-default}
      RAGGEDLIB_MCP_API_KEYS_0_KEY: ${MCP_API_KEY:-}
      RAGGEDLIB_OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
    volumes:
      - ${CALIBRE_LIBRARY:-${HOME}/Documents/CalibreLibrary}:/library/0:ro
      - ${CALIBRE_LIBRARY_1:-${HOME}/Documents/CalibreLibraryNonFiction}:/library/1:ro
      - ${CALIBRE_LIBRARY_2:-${HOME}/Documents/CalibreLibraryMisc}:/library/2:ro
    ports:
      - "127.0.0.1:8090:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  ollama:
  reranker:
